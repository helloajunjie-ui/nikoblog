services:
  nikoblog:
    build: .
    container_name: nikoblog
    restart: unless-stopped
    ports:
      # 单端口暴露：前端与 API 均由同一二进制提供
      - "8080:8080"
    environment:
      - NIKOBLOG_PORT=8080
      - NIKOBLOG_DATA_DIR=/app/data
      - NIKOBLOG_JWT_SECRET=${NIKOBLOG_JWT_SECRET:-please-change-me-in-production}
    volumes:
      # 持久化 SQLite 数据库与上传图片
      - ./data:/app/data
